        }

        }

            min-height: 100vh;
            line-height: 1.55;
        }

        html[dir="rtl"] body {
            text-align: right;
        }

        .page {
            width: min(1500px, 93vw);
            margin: 0 auto;
            padding: 34px 0 42px;
            position: relative;
            z-index: 2;
        }

            pointer-events: none;
            border-radius: 999px;
            filter: blur(18px);
            opacity: 0.5;
            z-index: 1;
        }

        .shape-a {
            top: -70px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: #74c6ea;
        }

        .shape-b {
            bottom: 36px;
            left: -120px;
            width: 260px;
            height: 260px;
            background: #98dde0;
        }

        .hero {

            border: 1px solid var(--surface-border);
            border-radius: 26px;
            background: linear-gradient(150deg, #fafdff 8%, #dff3fb 90%);

        .brand {

            gap: 10px;

            border: 1px solid #b7dceb;

            letter-spacing: 0.02em;
        }

            -webkit-appearance: none;
            -moz-appearance: none;
            border: none;
            background: var(--accent);
            color: #fff;
            border-radius: 999px;
            padding: 10px 36px 10px 16px;

            background-position: right 14px center;
            background-size: 10px 7px;

            outline-offset: 2px;
        }

        .lang-select option {
            color: #09324b;
            background: #ffffff;

            height: 150px;

            pointer-events: none;

        .app-actions {

        .app-secondary-links {

        .app-info-link {

<script src="i18n.js"></script>
<script>
    const STORAGE_KEY = "kamesan_language";
    const FALLBACK_LANG = "en";
    const SUPPORTED = new Set(LANGUAGES.map((l) => l.code));

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#39;"
        }[c]));
    }

    function pick(field, language) {
        if (field && field[language] != null) return field[language];
        if (field && field[FALLBACK_LANG] != null) return field[FALLBACK_LANG];
        return "";
    }

    function normalizeBrowserLanguage(raw) {
        if (!raw) return FALLBACK_LANG;
        const lower = raw.toLowerCase();

        // Exact / region matches
        if (lower === "zh-cn" || lower === "zh-hans" || lower.startsWith("zh-hans") || lower === "zh-sg") return "zh-CN";
        if (lower === "zh-tw" || lower === "zh-hk" || lower === "zh-hant" || lower.startsWith("zh-hant")) return "zh-TW";
        if (lower.startsWith("zh")) return "zh-CN";
        if (lower === "pt-br" || lower.startsWith("pt-br")) return "pt-BR";
        if (lower.startsWith("pt")) return "pt-BR";
        if (lower === "es-es" || lower.startsWith("es-es")) return "es-ES";
        if (lower.startsWith("es")) return "es-419";

        // Plain language code
        const base = lower.split("-")[0];
        const map = {
            en: "en", de: "de", fr: "fr", id: "id", in: "id", ja: "ja", ko: "ko",
            it: "it", pl: "pl", ru: "ru", hi: "hi", tr: "tr", ar: "ar",
            nl: "nl", vi: "vi", th: "th"
        };
        return map[base] || FALLBACK_LANG;
    }

    function getInitialLanguage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored && SUPPORTED.has(stored)) return stored;

        const candidates = (navigator.languages && navigator.languages.length)
            ? navigator.languages
            : [navigator.language || ""];
        for (const c of candidates) {
            const norm = normalizeBrowserLanguage(c);
            if (SUPPORTED.has(norm)) return norm;
        }
        return FALLBACK_LANG;
    }

    function populateLanguageSelect() {
        const select = document.getElementById("lang-select");
        select.innerHTML = LANGUAGES.map((l) =>
            `<option value="${l.code}">${escapeHtml(l.label)}</option>`
        ).join("");
    }

    function setText(language) {
        const words = TEXT[language] || TEXT[FALLBACK_LANG];
        const isRtl = RTL_LANGUAGES.has(language);

        document.documentElement.lang = language;
        document.documentElement.dir = isRtl ? "rtl" : "ltr";

        document.getElementById("brand").textContent = words.brand;
        document.getElementById("apps-title").textContent = words.appsTitle;
        document.getElementById("support-title").textContent = words.supportTitle;
        document.getElementById("support-text").textContent = words.supportText;

        const supportLinkEl = document.getElementById("support-link");
        supportLinkEl.textContent = words.supportLink;
        supportLinkEl.setAttribute("href", words.supportUrl);

        document.getElementById("privacy-title").textContent = words.privacyTitle;
        document.getElementById("privacy-text").textContent = words.privacyText;
        document.getElementById("privacy-link").textContent = words.privacyLink;
        document.querySelector(".footer-mail").setAttribute("aria-label", words.mailAria);
        document.querySelectorAll(".ja-only-links").forEach((el) => {
            el.hidden = language !== "ja";
        });

        const grid = document.getElementById("app-grid");
        const visibleApps = APPS.filter((app) =>
            !app.visibleLanguages || app.visibleLanguages.includes(language)
        );
        grid.innerHTML = visibleApps.map((app) => {
            const name = pick(app.name, language);
            const description = pick(app.description, language);
            const landingLink = app.landingPageUrl
                ? `<a class="app-info-link" href="${app.landingPageUrl}">${escapeHtml(app.landingPageLabel || "")}</a>`
                : "";
            const infoLink = app.officialInfoUrl
                ? `<a class="app-info-link" href="${app.officialInfoUrl}">${escapeHtml(app.officialInfoLabel || "")}</a>`
                : "";
            const androidLabel = app.androidStoreLabel || words.openStore;
            const storeLinks = app.iosUrl
                ? `<div class="app-store-links"><a class="play-link" href="${app.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(androidLabel)}</a><a class="play-link store-secondary" href="${app.iosUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(app.iosStoreLabel || "iPhone版")}</a></div>`
                : `<a class="play-link" href="${app.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(androidLabel)}</a>`;
            return `
                <article class="app-card">
                    <div class="app-card-top">
                        <div class="app-icon-frame">
                            <img class="app-icon" src="${app.icon}" alt="${escapeHtml(name)}" loading="lazy" decoding="async" width="60" height="60">
                        </div>
                        <div class="app-head">
                            <h3 class="app-name">${escapeHtml(name)}</h3>
                            ${app.isNew ? `<span class="new-badge">${escapeHtml(words.newBadge)}</span>` : ""}
                        </div>
                    </div>
                    <p class="app-description">${escapeHtml(description)}</p>
                    <div class="app-actions">
                        ${storeLinks}
                        ${landingLink || infoLink ? `<div class="app-secondary-links">${landingLink}${infoLink}</div>` : ""}
                    </div>
                </article>
            `;
        }).join("");

        const select = document.getElementById("lang-select");
        if (select.value !== language) select.value = language;
    }

    function applyLanguage(language) {
        const lang = SUPPORTED.has(language) ? language : FALLBACK_LANG;
        setText(lang);
        localStorage.setItem(STORAGE_KEY, lang);
    }

    populateLanguageSelect();
    document.getElementById("lang-select").addEventListener("change", (e) => {
        applyLanguage(e.target.value);
    });

    applyLanguage(getInitialLanguage());
</script>
</body>

</html>
